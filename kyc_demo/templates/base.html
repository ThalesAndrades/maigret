<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo KYC · LGPD</title>
  <style>
    :root { --bg:#0f1320; --card:#1a2032; --ink:#e7ecf5; --muted:#9aa7c0;
            --ok:#27c093; --warn:#f0b429; --bad:#ef5b5b; --acc:#5b8def; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif;
           background:var(--bg); color:var(--ink); }
    header { padding:20px 28px; background:linear-gradient(90deg,#15406b,#0f1320);
             border-bottom:1px solid #2a3450; }
    header h1 { margin:0; font-size:20px; }
    header p { margin:4px 0 0; color:var(--muted); font-size:13px; }
    main { max-width:1040px; margin:0 auto; padding:24px; }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:18px; }
    .card { background:var(--card); border:1px solid #2a3450; border-radius:12px;
            padding:18px 20px; margin-bottom:18px; }
    .card h2 { margin:0 0 12px; font-size:15px; color:var(--acc);
               text-transform:uppercase; letter-spacing:.04em; }
    label { display:block; font-size:12px; color:var(--muted); margin:10px 0 4px; }
    input,select { width:100%; padding:9px 11px; border-radius:8px;
                   border:1px solid #34405e; background:#10162a; color:var(--ink); }
    button { cursor:pointer; border:0; border-radius:8px; padding:10px 16px;
             font-weight:600; background:var(--acc); color:#fff; margin-top:14px; }
    button.ghost { background:transparent; border:1px solid #34405e; color:var(--muted); }
    button.ok { background:var(--ok); } button.bad { background:var(--bad); }
    .pill { display:inline-block; padding:3px 10px; border-radius:999px;
            font-size:12px; font-weight:700; }
    .pill.ok{background:rgba(39,192,147,.15);color:var(--ok);}
    .pill.warn{background:rgba(240,180,41,.15);color:var(--warn);}
    .pill.bad{background:rgba(239,91,91,.15);color:var(--bad);}
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { text-align:left; padding:7px 8px; border-bottom:1px solid #232b42;
            vertical-align:top; }
    th { color:var(--muted); font-weight:600; }
    code { background:#10162a; padding:1px 6px; border-radius:6px; font-size:12px; }
    .muted { color:var(--muted); font-size:12px; }
    .flow { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
    .flow span { padding:5px 10px; border-radius:8px; background:#10162a;
                 border:1px solid #2a3450; font-size:12px; color:var(--muted); }
    a { color:var(--acc); }
  </style>
</head>
<body>
  <header>
    <h1>🛡️ Demo de KYC com Biometria — conforme LGPD</h1>
    <p>Provedores SIMULADOS · dados fictícios · referência: docs/kyc-fluxo-lgpd.md</p>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
